name: Actualizar Noticias de Venezuela (ETL Pipeline)

on:
  schedule:
    # Ejecuta dos veces al día a las 10:00 y 22:00 UTC (06:00 y 18:00 HLV)
    - cron: '0 10,22 * * *'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Scraper Asíncrono
        run: |
          python scraper.py

      - name: Verificar cambios en data.json
        id: git-check
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain data.json)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit y Push de data.json
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "chore(data): actualización automática de noticias [skip ci]"
          git push origin main
